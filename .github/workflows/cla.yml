name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened,synchronize]
  merge_group:

permissions:
  actions: write
  contents: write # to store signatures on cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  CLAssistant:
    # Internal changes in this private Serspace fork do not use the upstream CLA bot.
    # Keep the inherited behavior elsewhere, or if this repository becomes public.
    if: github.repository != 'serspace-org/serspace-cloudflare-os' || github.event.repository.private != true
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.issue.pull_request && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')) || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://www.cloudflare.com/cla/'
          # branch should not be protected
          branch: 'cla-signatures'
          allowlist: dependabot[bot],workers-devprod,github-actions[bot]
          lock-pullrequest-aftermerge: false
